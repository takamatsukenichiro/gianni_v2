<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6f857" />
      <stop offset="50%" stop-color="#aaed2e" />
      <stop offset="100%" stop-color="#80be12" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="128"
    fill="url(#bgGrad)"
    stroke="#aaed2e"
    stroke-width="8"
    stroke-opacity="0.35"
  />

  <!-- Inner border -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="120"
    fill="none"
    stroke="url(#limeGrad)"
    stroke-width="4"
    stroke-opacity="0.7"
  />

  <!-- BF Logo -->
  <g filter="url(#neonGlow)">

    <!-- B -->
    <path
      d="
        M 150 155
        L 150 360

        M 150 155
        L 205 155
        C 245 155 265 175 265 205
        C 265 235 245 250 210 250
        L 150 250

        M 150 250
        L 210 250
        C 250 250 270 270 270 305
        C 270 340 245 360 205 360
        L 150 360
      "
      fill="none"
      stroke="url(#limeGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- F -->
    <path
      d="
        M 285 360
        L 285 160
        L 385 160

        M 285 250
        L 385 250
      "
      fill="none"
      stroke="url(#limeGrad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Cyan start point of B -->
    <circle
      cx="150"
      cy="155"
      r="22"
      fill="url(#cyanGrad)"
    />

    <!-- Cyan endpoint of second horizontal line of F -->
    <circle
      cx="385"
      cy="250"
      r="22"
      fill="url(#cyanGrad)"
    />

  </g>
</svg>